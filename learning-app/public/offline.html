<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#8f03e6" />
    <title>Growvelt is offline</title>
    <script>
      try {
        var storedTheme = localStorage.getItem("growvelt-theme");
        var theme = storedTheme === "light" || storedTheme === "dark" || storedTheme === "system" ? storedTheme : "light";
        document.documentElement.dataset.theme = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
      } catch (_) { document.documentElement.dataset.theme = "light"; }
    </script>
    <style>
      :root {
        color-scheme: light;
        --page: #fff;
        --ink: #171324;
        --muted: #595367;
        --accent: #7800c9;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --page: #0b1120;
        --ink: #f8fafc;
        --muted: #cbd5e1;
        --accent: #d3a1ff;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        grid-template-rows: auto 1fr;
        background: var(--page);
        color: var(--ink);
        font-family: system-ui, sans-serif;
      }

      header {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: max(20px, env(safe-area-inset-top)) clamp(18px, 4vw, 40px) 0;
        font-weight: 680;
        letter-spacing: -0.025em;
      }

      header img { display: block; width: 30px; height: 30px; }

      main {
        display: grid;
        place-items: center;
        padding: 32px 20px max(64px, env(safe-area-inset-bottom));
        text-align: center;
      }

      .signal {
        display: block;
        width: clamp(46px, 8vw, 64px);
        height: auto;
        margin: 0 auto 16px;
        color: var(--accent);
      }

      h1 {
        margin: 0;
        font-size: clamp(26px, 5vw, 36px);
        line-height: 1.15;
        letter-spacing: -0.035em;
      }

      p {
        margin: 10px 0 20px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.5;
      }

      button {
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 9px;
        background: #7800c9;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 650;
      }

      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="/android-chrome-192x192.png?v=10" width="30" height="30" alt="" />
      Growvelt Learning
    </header>
    <main aria-labelledby="offline-title">
      <div>
        <svg class="signal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <path d="m3 3 18 18M7.5 7.5A14 14 0 0 1 22 9m-20 0a14 14 0 0 1 2.6-1.7M5 12.6a9 9 0 0 1 5.2-2.1m4.3.4a9 9 0 0 1 4.5 1.7M8.5 16a5.5 5.5 0 0 1 5.2-.9M12 20h.01" />
        </svg>
        <h1 id="offline-title">You’re offline</h1>
        <p>Connect to Wi-Fi or mobile data to continue.</p>
        <button type="button" onclick="window.location.reload()">Try again</button>
      </div>
    </main>
  </body>
</html>
